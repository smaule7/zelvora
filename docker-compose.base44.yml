services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy host is accepted
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install --legacy-peer-deps --no-audit --no-fund && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
